components:
  schemas:
    ResultType:
      type: string
      enum:
      - code_security
      - code_security, code_quality
    ScanConfig:
      type: object
      properties:
        scanners:
          type: array
          items:
            type: string
            enum:
            - all_scanners
            - sast
            - sca
            - legacy_scanners
            - secrets
            - container
        result_type:
          $ref: '#/components/schemas/ResultType'
        limit_test_to_files:
          description: A list of file paths to use in the scan. If empty the whole
            target is tested.
          type: array
          items:
            type: string
        exclusion_globs:
          description: A list of file paths and directories to exclude from the workspace.
            If empty default exclusion globs apply, according to the coordinate type.
          type: array
          items:
            type: string
        inclusion_globs:
          description: A list of file paths to include in the workspace. If empty,
            all files are included (subject to exclusion globs).
          type: array
          items:
            type: string
        limit_test_to_projects:
          description: A list of project IDs to limit the test to. If empty, all projects
            are tested.
          type: array
          items:
            type: string
            format: uuid
      additionalProperties: false
    OutputConfig:
      type: object
      properties:
        report:
          type: boolean
          description: Determines if the test is stateless (false) or stateful (true)
        monitor:
          type: boolean
          description: Determines if a project should be created (true) or not (false).
        project_name:
          type: string
          pattern: ^[?#@&+=%a-zA-Z0-9_.~\/\\:\s-]+$
        project_id:
          type: string
          format: uuid
        target_name:
          type: string
          pattern: ^[?#@&+=%a-zA-Z0-9_.~\/\\:\s-]+$
        asset_name:
          type: string
          description: The name used for the asset.
          pattern: ^[?#@&+=%a-zA-Z0-9_.~\/\\:\s-]+$
        asset_id:
          type: string
          format: uuid
          description: The id of the asset to associate with the test.
        target_reference:
          type: string
          description: A reference for the target's version - can be a git branch
            or a commit sha
          example: main
        label:
          type: string
          description: 'Arbitrary value up to the user. Deprecated: use `labels` instead.'
          deprecated: true
          pattern: ^[:/?#@&+=%a-zA-Z0-9_.~-]+$
        labels:
          type: object
          description: Arbitrary string values up to the user, up to 10 keys
          maxProperties: 10
          additionalProperties:
            type: string
            pattern: ^[:/?#@&+=%a-zA-Z0-9_.~-]+$
        origin:
          type: string
          description: The source control management system or platform origin
          pattern: ^[a-zA-Z-]+$
          example: github
        initiator:
          type: string
          description: The type of test flow or system that initiated the test
          enum:
          - api_test
          - pr_check
          - cli_test
          - ide_test
          - manual_test
          - recurring_test
          - import
          - auto_import
          - essentials_import
          - api_import
          - push_test
          - manual_retest
          - container_import
          example: api_test
        project_environment:
          type: array
          description: Project environment attributes
          items:
            type: string
            enum:
            - frontend
            - backend
            - internal
            - external
            - mobile
            - saas
            - onprem
            - hosted
            - distributed
          example:
          - frontend
          - backend
        project_business_criticality:
          type: array
          description: Project business criticality attributes
          items:
            type: string
            enum:
            - critical
            - high
            - medium
            - low
          example:
          - high
        project_lifecycle:
          type: array
          description: Project lifecycle attributes
          items:
            type: string
            enum:
            - production
            - development
            - sandbox
          example:
          - production
        project_tags:
          type: array
          description: 'Project tags as an array of key=value pairs. Each tag must
            be in the format ''key=value''. Example: ["department=finance", "team=alpha"]'
          items:
            type: string
            pattern: ^[a-zA-Z0-9_-]{1,30}=[:/?#@&+=%a-zA-Z0-9_.~-]{1,256}$
          example:
          - department=finance
          - team=alpha
      additionalProperties: false
    TestConfiguration:
      type: object
      properties:
        scan:
          $ref: '#/components/schemas/ScanConfig'
        output:
          $ref: '#/components/schemas/OutputConfig'
      additionalProperties: false
    TestAttributes:
      type: object
      properties:
        input:
          oneOf:
          - $ref: '#/components/schemas/TestInputSourceBundle'
          - $ref: '#/components/schemas/TestInputSBOMBundle'
          - $ref: '#/components/schemas/TestInputLegacyScmProject'
          - $ref: '#/components/schemas/TestInputGitUrlCoordinates'
          - $ref: '#/components/schemas/TestInputDiffTarget'
          - $ref: '#/components/schemas/TestInputTarget'
          - $ref: '#/components/schemas/TestInputScmTarget'
          - $ref: '#/components/schemas/TestInputSBOMSourceBundles'
          - $ref: '#/components/schemas/TestInputWorkspace'
          - $ref: '#/components/schemas/TestInputUploadRevision'
          - $ref: '#/components/schemas/TestInputSBOMRevision'
          - $ref: '#/components/schemas/TestInputSBOMSourceRevisions'
          - $ref: '#/components/schemas/TestInputContainerAnalysisRevision'
        configuration:
          $ref: '#/components/schemas/TestConfiguration'
      additionalProperties: false
    TestInputSourceBundle:
      type: object
      properties:
        type:
          type: string
          enum:
          - source_bundle
          example: source_bundle
        bundle_id:
          description: A Snyk bundle id
          type: string
          maxLength: 100
          example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
        metadata:
          description: Metadata of the input to be tested
          type: object
          properties:
            local_file_path:
              type: string
              description: This can be a file path or a folder id for IDE
            repo_url:
              type: string
              maxLength: 1000
              description: 'The repo URL of the input being tested. This is used for
                correlating the results of the test with the asset.

                This will result in stable finding identities for subsequent tests
                of the same repository.

                '
              example: 'https://github.com/test-repo/test-goof

                github.com:test-repo/test-repo.git

                git@github.com:test-repo/test-repo.git

                '
            commit_id:
              description: SHA of the commit being tested
              type: string
              example: 024db817148169e6ca9e7f33408cca01002c1dce
            limit_test_to_files:
              description: The findings will be limited to a subset of files only.
              type: array
              items:
                type: string
            branch:
              type: string
              maxLength: 1000
              description: The name of the branch being tested
          required:
          - local_file_path
      required:
      - type
      - bundle_id
      - metadata
    TestInputSBOMBundle:
      type: object
      properties:
        type:
          type: string
          enum:
          - sbom_bundle
          example: sbom_bundle
        bundle_id:
          description: Bundle id of the SBOM bundle
          type: string
          maxLength: 100
          example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
        metadata:
          description: Metadata of the SBOM bundle
          type: object
          properties:
            local_file_path:
              type: string
              description: SBOM file path
          required:
          - local_file_path
      required:
      - type
      - bundle_id
      - metadata
    TestInputSBOMRevision:
      type: object
      properties:
        type:
          type: string
          enum:
          - sbom_revision
          example: sbom_revision
        revision_id:
          description: Revision id of the SBOM revision
          type: string
          format: uuid
          example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
        metadata:
          description: Metadata of the SBOM revision
          type: object
          properties:
            local_file_path:
              type: string
              description: SBOM file path
          required:
          - local_file_path
      required:
      - type
      - revision_id
      - metadata
    TestInputSBOMSourceRevisions:
      type: object
      properties:
        type:
          type: string
          enum:
          - sbom_source_revisions
          example: sbom_source_revisions
        source:
          type: object
          properties:
            revision_id:
              description: Revision id of the source code revision
              type: string
              format: uuid
              example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
            metadata:
              description: Metadata of the source code revision
              type: object
              properties:
                local_file_path:
                  type: string
                  description: File or directory path for the source code
              required:
              - local_file_path
          required:
          - revision_id
          - metadata
        sbom:
          type: object
          properties:
            revision_id:
              description: Revision id of the SBOM revision
              type: string
              format: uuid
              example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
            metadata:
              description: Metadata of the SBOM revision
              type: object
              properties:
                local_file_path:
                  type: string
                  description: SBOM file path
              required:
              - local_file_path
          required:
          - revision_id
          - metadata
      required:
      - type
      - sbom
      - source
    TestInputSBOMSourceBundles:
      type: object
      properties:
        type:
          type: string
          enum:
          - sbom_sast_bundles
          example: sbom_sast_bundles
        source:
          type: object
          properties:
            bundle_id:
              description: Bundle id of the source code bundle
              type: string
              maxLength: 100
              example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
            metadata:
              description: Metadata of the source code bundle
              type: object
              properties:
                local_file_path:
                  type: string
                  description: File or directory path for the source code
              required:
              - local_file_path
          required:
          - bundle_id
          - metadata
        sbom:
          type: object
          properties:
            bundle_id:
              description: Bundle id of the SBOM bundle
              type: string
              maxLength: 100
              example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
            metadata:
              description: Metadata of the SBOM bundle
              type: object
              properties:
                local_file_path:
                  type: string
                  description: SBOM file path
              required:
              - local_file_path
          required:
          - bundle_id
          - metadata
      required:
      - type
      - sbom
      - source
    TestInputLegacyScmProject:
      type: object
      properties:
        type:
          type: string
          enum:
          - legacy_scm_project
          example: legacy_scm_project
        project_id:
          description: Id of the project to be tested
          type: string
          format: uuid
          example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
        commit_id:
          description: SHA of the commit to be tested
          type: string
          example: 024db817148169e6ca9e7f33408cca01002c1dce
      required:
      - type
      - project_id
      - commit_id
    TestInputGitUrlCoordinates:
      type: object
      properties:
        type:
          type: string
          enum:
          - git_url_coordinates
          example: git_url_coordinates
        integration_id:
          description: A Snyk integration id that has access to the repository.
          type: string
          format: uuid
          example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
        repo_url:
          description: A repository url for which a test will run.
          type: string
          maxLength: 1000
          example: https://github.com/snyk/goof
        revision:
          description: SHA of the commit to be tested.
          type: string
          example: 97cea0113b8807b00a5c70d5e9073f908a8baae2
      required:
      - type
      - integration_id
      - repo_url
      - revision
    TestInputDiffTarget:
      type: object
      properties:
        type:
          type: string
          enum:
          - diff_scm_target
          example: diff_scm_target
        target_id:
          description: Id of the target to be tested
          example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
          format: uuid
          type: string
        integration_id:
          description: A Snyk integration id that has access to the target's repository.
          type: string
          format: uuid
          example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
        base_version:
          description: SHA of the last commit existing in base branch
          type: string
          example: 024db817148169e6ca9e7f33408cca01002c1dce
        head_version:
          description: SHA of the commit to be tested
          type: string
          example: 024db817148169e6ca9e7f33408cca01002c1dce
      required:
      - type
      - target_id
      - base_version
      - head_version
    TestInputTarget:
      type: object
      properties:
        type:
          type: string
          enum:
          - target
          example: target
        target_id:
          description: Id of the target to be tested
          type: string
          format: uuid
          example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
        version:
          description: This target's version, like a git branch, a commit sha, or
            a Docker image tag
          type: string
          example: main
      required:
      - type
      - target_id
      - version
    TestInputScmTarget:
      type: object
      properties:
        type:
          type: string
          enum:
          - scm_target
          example: scm_target
        target_id:
          description: Id of the target to be tested
          type: string
          format: uuid
          example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
        version:
          description: This target's version, like a git branch, a commit sha, or
            a Docker image tag
          type: string
          example: main
      required:
      - type
      - target_id
      - version
    TestInputWorkspace:
      type: object
      properties:
        type:
          type: string
          enum:
          - workspace
          example: workspace
        workspace_id:
          description: Id of the workspace to be tested
          type: string
          format: uuid
          example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
      required:
      - type
      - workspace_id
    TestInputUploadRevision:
      type: object
      properties:
        type:
          type: string
          enum:
          - upload_revision
          example: upload_revision
        revision_id:
          description: A Snyk revision id
          type: string
          maxLength: 100
          example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
        metadata:
          description: Metadata of the input to be tested
          type: object
          properties:
            local_file_path:
              type: string
              description: This can be a file path or a folder id for IDE
            repo_url:
              type: string
              maxLength: 1000
              description: 'The repo URL of the input being tested. This is used for
                correlating the results of the test with the asset.

                This will result in stable finding identities for subsequent tests
                of the same repository.

                '
              example: 'https://github.com/test-repo/test-goof

                github.com:test-repo/test-repo.git

                git@github.com:test-repo/test-repo.git

                '
            commit_id:
              description: SHA of the commit being tested
              type: string
              example: 024db817148169e6ca9e7f33408cca01002c1dce
            branch:
              type: string
              maxLength: 1000
              description: The name of the branch being tested
      required:
      - type
      - revision_id
    TestInputContainerAnalysisRevision:
      type: object
      properties:
        type:
          type: string
          enum:
          - container_analysis_revision
          example: container_analysis_revision
        revision_id:
          description: A Snyk revision id referencing the uploaded container analysis
          type: string
          maxLength: 100
          example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
      required:
      - type
      - revision_id
    TestResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              description: The id of the Snyk test
              type: string
              format: uuid
              example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
            type:
              type: string
              enum:
              - test
              example: test
          required:
          - id
          - type
        links:
          $ref: ../common/common.yaml#/components/schemas/SelfLink
        jsonapi:
          $ref: ../common/common.yaml#/components/schemas/JsonApi
      additionalProperties: false
      required:
      - data
      - links
    CreateTestRequestBody:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
              - test
              example: test
            id:
              type: string
              format: uuid
              description: Optional identifier for the test
              example: 275af21f-e92b-40aa-8604-ef9b00c9bd8d
            attributes:
              $ref: '#/components/schemas/TestAttributes'
              required:
              - input
          additionalProperties: false
          required:
          - type
          - attributes
      additionalProperties: false
      required:
      - data
    TestResult:
      type: object
      properties:
        jsonapi:
          $ref: ../common/common.yaml#/components/schemas/JsonApi
        links:
          $ref: ../common/common.yaml#/components/schemas/SelfLink
        data:
          type: object
          properties:
            type:
              type: string
              enum:
              - test
              example: test
            id:
              type: string
              format: uuid
              description: The id of the test
            attributes:
              $ref: '#/components/schemas/TestState'
          additionalProperties: false
          required:
          - type
          - id
          - attributes
      additionalProperties: false
      required:
      - data
      - jsonapi
      - links
    TestInitialConfigurationResponse:
      type: object
      properties:
        jsonapi:
          $ref: ../common/common.yaml#/components/schemas/JsonApi
        links:
          $ref: ../common/common.yaml#/components/schemas/SelfLink
        data:
          type: object
          properties:
            type:
              type: string
              enum:
              - test
              example: test
            attributes:
              $ref: '#/components/schemas/TestAttributes'
          additionalProperties: false
      additionalProperties: false
    TestState:
      oneOf:
      - $ref: '#/components/schemas/TestAcceptedState'
      - $ref: '#/components/schemas/TestInProgressState'
      - $ref: '#/components/schemas/TestCompletedState'
      - $ref: '#/components/schemas/TestErrorState'
      discriminator:
        propertyName: status
    TestAcceptedState:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: Timestamp when the test was created
        status:
          type: string
          enum:
          - accepted
      required:
      - created_at
      - status
    TestInProgressState:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: Timestamp when the test was created
        status:
          type: string
          enum:
          - in_progress
      required:
      - created_at
      - status
    TestCompletedState:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: Timestamp when the test was created
        status:
          type: string
          enum:
          - completed
        result:
          description: The outcome of the test. This field is deprecated.
          type: string
          enum:
          - passed
          - failed
          deprecated: true
      required:
      - created_at
      - status
      - result
    TestErrorState:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: Timestamp when the test was created
        status:
          type: string
          enum:
          - error
        errors:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                description: The high-level description of an error catalog error
              message:
                type: string
                description: A custom description of an error.
                example: The server cannot process the request due to an unexpected
                  error. Check Snyk status, then try again.
              error_code:
                type: string
                description: The Snyk error code
                example: SNYK-9999
              classification:
                type: string
                example: UNEXPECTED
                description: A type of error
              info_url:
                type: string
                description: The URL to link to more information about the error
                example: https://docs.snyk.io/scan-with-snyk/error-catalog#snyk-9999
            required:
            - title
            - message
            - error_code
            - classification
      required:
      - created_at
      - status
    CreateBatchTestRequestBody:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
              - batch_test
              example: batch_test
            attributes:
              $ref: '#/components/schemas/CreateBatchTestAttributes'
          required:
          - type
          - attributes
      required:
      - data
    CreateBatchTestAttributes:
      type: object
      properties:
        scanner:
          type: string
          enum:
          - secrets
          - sca
          description: The scanner type to use for all tests in the batch
          example: secrets
        input:
          $ref: '#/components/schemas/BatchInput'
        initiator:
          type: string
          description: The type of test flow that initiated the batch
          enum:
          - recurring_test
          example: recurring_test
      required:
      - scanner
      - input
      - initiator
    BatchInput:
      type: object
      description: Reference to the batch file in object storage
      properties:
        bucket:
          type: string
          description: Name of the bucket where the batch file is stored
          example: my-batch-bucket
        path:
          type: string
          description: Path to the batch file within the bucket
          example: batches/secrets-2024-01-01.json
      required:
      - bucket
      - path
